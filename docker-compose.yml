services:
  call-track:
    build: .
    container_name: call-track
    ports:
      - "3000:3000"
    volumes:
      - call-track-data:/data
    environment:
      - DATABASE_URL=file:/data/dev.db
      # IMPORTANT: Replace AUTH_SECRET and NEXTAUTH_SECRET with strong random values before deploying.
      # Generate one: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      # NEVER use the placeholder value in production.
      - AUTH_SECRET=your-secret-change-in-production-min-32-chars
      - AUTH_URL=https://calltrack.flexibook.ai
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_SECRET=your-secret-change-in-production-min-32-chars
      - NEXTAUTH_URL=https://calltrack.flexibook.ai
    restart: unless-stopped

volumes:
  call-track-data:
